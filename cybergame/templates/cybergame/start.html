{% extends "cybergame/base.html" %}

{% block title %}Grade {{ grade.number }} — Cyber Squad{% endblock %}

{% block content %}
<section class="panel grade-{{ grade.number }}-accent">
  <div class="panel-buddy" aria-hidden="true">{{ buddy }}</div>
  <h1 class="panel-title">Grade {{ grade.number }}</h1>
  {% if grade.intro %}<p class="panel-line">{{ grade.intro }}</p>{% endif %}
  <p class="panel-line">{{ total }} rounds. Win ⭐ stars!</p>
  <a class="btn btn-go" href="{% url 'cybergame:question' grade.number 0 %}">Start</a>
  <a class="btn-back" href="{% url 'cybergame:grade_select' %}">Change grade</a>
</section>
{% endblock %}
