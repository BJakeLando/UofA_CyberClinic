{% extends "cybergame/base.html" %}
{% block title %}Join your class{% endblock %}

{% block content %}
<section class="panel" id="join">
  <div class="panel-buddy" aria-hidden="true">🔢</div>
  <h1 class="panel-title">Room code</h1>
  <p class="panel-line" data-say="Type the six numbers your teacher put on the board.">
    Type the 6 numbers your teacher put on the board.
  </p>

  {% if error %}<p class="form-error" role="alert" data-say="{{ error }}">{{ error }}</p>{% endif %}

  <form method="post" class="code-form">
    {% csrf_token %}
    <input class="code-input" type="text" name="code" inputmode="numeric"
           autocomplete="off" maxlength="12" placeholder="123456"
           aria-label="Room code" autofocus>
    <button class="btn btn-go" type="submit">Join</button>
  </form>

  <a class="btn-back" href="{% url 'cybergame:home' %}">Back</a>
</section>
{% endblock %}
