{% extends "cybergame/base.html" %}

{% block content %}
<header class="home">
  <div class="home-badge" aria-hidden="true">🛡️</div>
  <h1 class="home-title">Cyber Squad</h1>
  <p class="home-sub">Pick your grade</p>
</header>

<nav class="grades" aria-label="Pick your grade">
  {% for grade in grades %}
    <a class="grade grade-{{ grade.number }}" href="{% url 'cybergame:start_grade' grade.number %}">
      <span class="grade-buddy" aria-hidden="true">{{ grade.buddy }}</span>
      <span class="grade-word">Grade</span>
      <span class="grade-num">{{ grade.number }}</span>
    </a>
  {% empty %}
    <p class="empty">No grades yet. Run: python manage.py seed_content</p>
  {% endfor %}
</nav>
{% endblock %}
